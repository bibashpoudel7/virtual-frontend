name: Deploy Frontend to Development

on:
  workflow_dispatch:
  push:
    branches: [dev]

# Never run two deploys of the same environment at once
concurrency:
  group: frontend-deploy-dev
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove existing env file
        run: rm -rf .env

      - name: Create .env file from base64 secret
        run: |
          echo -n "${{ secrets.DEV_ENV_FILE }}" | base64 -d > .env

      - name: Login to Docker Hub, Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/virtual-frontend:develop .
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/virtual-frontend:develop
          docker image prune -f

  deploy:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH into the server and pull the Docker image
        uses: fifsky/ssh-action@master
        with:
          command: |
            # Login to DockerHub to pull images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S bash -c 'echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin'

            # Pull docker image
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose pull frontend

            # Run docker-compose
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker compose up -d frontend

            # Removing dangling images
            echo ${{ secrets.SUDO_PASSWORD }} | sudo -S docker image prune -f

          host: ${{ secrets.SERVER_IP }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: "-T -o StrictHostKeyChecking=no"

      - name: Cleanup sensitive files
        run: rm -rf .env
